[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php /var/www/html/think queue:work --queue=default --tries=3 --timeout=60
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; mobile-builds 队列专用 worker（v2.6.0 Phase D）
; 与默认 worker 解耦的原因：
;   - mobile build 跑 pnpm install + uni build，单任务可达 600s+
;   - 默认 worker --timeout=60 会强杀长任务
;   - numprocs=1 避免两个 pnpm install 同时拉 node_modules 抢占磁盘 IO
;   - tries=1：失败由 TenantMobileBuildService::run 内部捕获并写 error_log；
;     基础设施级失败由 MobileBuildJob 兜底（不重试，避免堵队列）
[program:mobile-build-worker]
command=php /var/www/html/think queue:work --queue=mobile-builds --tries=1 --timeout=900 --sleep=3
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron-scheduler]
command=/bin/sh -c "while true; do php /var/www/html/think cron:run 2>&1; sleep 60; done"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ============================================================
# ydadmin-saas Nginx 多 vhost 配置
#
# 三个 vhost + 一个 fallback：
#   1. admin.SAAS_ROOT         → 平台超管后台 (platform/dist + /platformapi)
#   2. *.SAAS_ROOT (正则通配)    → 租户后台 (tenant/dist + /tenantapi + /api)
#   3. SAAS_ROOT / www.*       → 公共前台 (pc/.output/public + /api)
#   4. default_server           → 返回 444 防 IP 直连暴露
#
# 部署时：
#   - DNS 里把 *.example.com + admin.example.com + example.com A/CNAME
#     到 nginx 容器对外 IP
#   - SSL 终结在 443（见 DEPLOYMENT.md 里的 Certbot 示例），本文件只保留 80
#
# SAAS_ROOT_PLACEHOLDER 由 entrypoint.sh 在容器启动时用 sed 替换成
# $SAAS_ROOT_DOMAIN 环境变量（见 docker/nginx/entrypoint.sh）。
#
# Nginx server_name 匹配优先级：精确 > 通配符 > 正则
# 所以 admin./www./根域名会被前两个 vhost 吃掉，租户通配 vhost 只接其他子域名。
# ============================================================

# ----- vhost 1: 平台超管后台 -----
server {
    listen 80;
    server_name admin.SAAS_ROOT_PLACEHOLDER;

    root /usr/share/nginx/html/platform;
    index index.html;

    include /etc/nginx/conf.d/includes/saas_common.conf;

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 平台 API
    location /platformapi {
        proxy_pass http://php:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 支付回调（公开匿名入口，platform 域名也提供）
    location /api/saas/notify {
        proxy_pass http://php:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----- vhost 2: 公共前台（pc / 营销页）-----
server {
    listen 80;
    server_name SAAS_ROOT_PLACEHOLDER www.SAAS_ROOT_PLACEHOLDER;

    # Nuxt 3 生成的静态产物目录
    root /usr/share/nginx/html/pc;
    index index.html;

    include /etc/nginx/conf.d/includes/saas_common.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 公共 API（非租户 scope）
    location /api {
        proxy_pass http://php:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----- vhost 3: 租户后台（正则通配子域名）-----
server {
    listen 80;
    # 捕获子域名到 $tenant_code（暂未用到，留给未来 access log / debug header）
    server_name ~^(?<tenant_code>[^.]+)\.SAAS_ROOT_PLACEHOLDER$;

    root /usr/share/nginx/html/tenant;
    index index.html;

    include /etc/nginx/conf.d/includes/saas_common.conf;

    # 租户移动端 H5 发布产物：
    # H5ReleaseService 发布到 server/public/mobile-tenants/{tenant_code}/
    # 访问入口为 http(s)://{tenant_code}.SAAS_ROOT/mobile/
    # 注意：try_files 最后一项若写 /index.html，会内部跳到 location / → PHP，
    # 移动端再被 Index 302 回 /mobile/ 形成死循环；SPA 回退必须用命名 location。
    location ^~ /mobile/ {
        rewrite ^/mobile/(.*)$ /$1 break;
        root /var/www/html/public/mobile-tenants/$tenant_code;
        index index.html;
        # rewrite 后 /mobile/ → URI「/」；仅 $uri/ 时常不触发 index，需显式 $uri/index.html
        try_files $uri $uri/index.html $uri/ @mobile_spa;
    }
    location @mobile_spa {
        root /var/www/html/public/mobile-tenants/$tenant_code;
        rewrite ^ /index.html break;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 租户 API（后端 TenantContextMiddleware 从 Host 头解析 tenant_code）
    location /tenantapi {
        proxy_pass http://php:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 公共 API 也挂上（uniapp / pc 从租户子域访问的场景）
    location /api {
        proxy_pass http://php:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----- vhost fallback: 未知域名 / IP 直连 -----
server {
    listen 80 default_server;
    server_name _;
    return 444;  # 无响应关闭连接
}

# ============================================================
# SaaS 共用片段 —— 被各 vhost include
#
# 内容：
#   - charset
#   - 安全头
#   - gzip 压缩
#   - /storage + /uploads 静态资源 alias（所有 vhost 共享后端文件）
#   - 禁止访问隐藏文件
# ============================================================

charset utf-8;

# ===== 安全头 =====
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self';" always;

# ===== 禁止访问隐藏文件 =====
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# ===== Gzip 压缩 =====
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

# ===== 后端静态资源（所有 vhost 共享）=====
location /storage {
    alias /var/www/html/public/storage;
    expires 30d;
    access_log off;
}

location /uploads {
    alias /var/www/html/public/uploads;
    expires 30d;
    access_log off;
}

# ===== 插件图标按需服务（v2.7.4）=====
# 路由 /plugin-icon/<code>/<file> 由 ThinkPHP 处理（server/route/app.php）
# 走 PHP-FPM 是为了校验 plugin status=ENABLED + manifest.icon 申明 + 路径穿越防护。
# Cache-Control 由 PHP 端返回（public, max-age=86400, immutable）。
location /plugin-icon {
    proxy_pass http://php:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
